<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>short title card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Figtree"; src: url("Figtree.ttf") format("truetype"); font-weight: 300 900; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:relative; width:1080px; height:1920px; }
      .wrap { position:absolute; left:0; right:0; top:69.0%; transform:translateY(-50%);
               display:flex; justify-content:center; }
      .card { position:relative; font-family:"Figtree", sans-serif; }
      .bar { height:16px; margin-left:16px;
              background:linear-gradient(90deg, #EEF2FC 0%, #7D9BE6 22%, #3A66D8 50%, #2151D1 100%); }
      .tab { position:absolute; left:0; top:0; width:16px; height:32px; z-index:2;
              background:linear-gradient(#000 0 50%, #2151D1 50% 100%); transform-origin:top; }
      .plate { background:#fff; padding:12px 30px 20px 24px; }
      .line { font-weight:700; font-size:60px; line-height:1.08; letter-spacing:-0.01em;
               color:#000; white-space:nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.461"
         data-width="1080" data-height="1920" data-fps="24000/1001">
      <div class="wrap"><div class="card">
        <div class="bar"></div><div class="tab"></div>
        <div class="plate">
          <div class="line">Why not just use</div>
          <div class="line">NVIDIA GPUs</div>
        </div>
      </div></div>
    </div>
    <script>
      // GENERATED by edit/title_overlay.py — do not hand-edit.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 44.461);
      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
