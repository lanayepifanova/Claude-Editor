<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>Jason Credit Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 3840px; height: 2160px; overflow: hidden; background: transparent; }

      :root {
        --ink:   #000000;
        --cream: #FAF7F2;
        --red:   #B32D1C;
        --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        --sans:  "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      #root { position: relative; width: 3840px; height: 2160px; }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
      .card { position: relative; width: 3200px; text-align: center; }

      .lift {
        text-shadow:
          6px 0 0 rgba(250,247,242,1), -6px 0 0 rgba(250,247,242,1), 0 6px 0 rgba(250,247,242,1), 0 -6px 0 rgba(250,247,242,1),
          4px 4px 0 rgba(250,247,242,1), -4px 4px 0 rgba(250,247,242,1), 4px -4px 0 rgba(250,247,242,1), -4px -4px 0 rgba(250,247,242,1);
      }
      .liftimg {
        filter:
          drop-shadow(5px 0 0 rgba(250,247,242,1)) drop-shadow(-5px 0 0 rgba(250,247,242,1))
          drop-shadow(0 5px 0 rgba(250,247,242,1)) drop-shadow(0 -5px 0 rgba(250,247,242,1));
      }
      .eyebrow { font-family: var(--sans); font-size: 56px; font-weight: 900;
                 letter-spacing: .34em; text-transform: uppercase;
                 color: var(--ink); margin-bottom: 52px; }

      .who { display: flex; align-items: center; justify-content: center;
             gap: 64px; margin-bottom: 62px; }
      .avatar { display: block; width: 300px; height: 300px; border-radius: 50%;
                border: 10px solid #000; object-fit: cover; }
      .who-text { text-align: left; }
      .name { font-family: var(--serif); font-size: 152px; font-weight: 700;
              line-height: 1.04; color: var(--ink); white-space: nowrap; }
      .handle { font-family: "JetBrains Mono", monospace; font-size: 62px;
                font-weight: 800; color: var(--red); margin-top: 12px; }

      .video { display: flex; align-items: center; justify-content: center; gap: 56px; }
      .thumb { display: block; width: 744px; height: 408px; border-radius: 22px;
               border: 8px solid #000; object-fit: cover; }
      .vtitle { text-align: left; max-width: 1180px;
                font-family: var(--serif); font-size: 82px; font-weight: 700;
                line-height: 1.16; color: var(--ink); }
      .vmeta { font-family: var(--sans); font-size: 46px; font-weight: 800;
               letter-spacing: .1em; color: var(--red); margin-top: 22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.40"
         data-width="3840" data-height="2160" data-fps="60" data-layout-allow-overflow="true">

      <section id="c1" class="clip" data-start="0" data-duration="3.40" data-track-index="1">
        <div class="card">
          <div class="content" id="c1-content">
            <div class="eyebrow lift">Inspired by</div>
            <div class="who">
              <img class="avatar liftimg" id="c1-avatar" src=".media/images/jason_avatar.png" alt="" />
              <div class="who-text lift">
                <div class="name">Jason Cooperson</div>
                <div class="handle">@jasoncooperson</div>
              </div>
            </div>
            <div class="video" id="c1-video">
              <img class="thumb liftimg" id="c1-thumb" src=".media/images/jason_thumb.png" alt="" />
              <div class="vwrap lift">
                <div class="vtitle">I taught Claude how to use Premiere Pro and it&rsquo;s INSANE.</div>
                <div class="vmeta">56K views</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // same shutter language as the main overlay


      tl.fromTo("#c1-content", { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: .36, ease: "power3.out" }, 0.22);
      tl.fromTo("#c1-avatar", { opacity: 0, scale: .84 },
        { opacity: 1, scale: 1, duration: .40, ease: "power3.out" }, 0.40);
      tl.fromTo("#c1-video", { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: .40, ease: "power3.out" }, 0.72);

      tl.to("#c1-content", { opacity: 0, y: -16, duration: .20, ease: "power2.in" }, 3.10);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
