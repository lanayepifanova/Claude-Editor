<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>higgsfield-photos-motion (overlay)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: transparent;
      }
      #src-video { width: 1080px; height: 1920px; object-fit: cover; }
      .beat { position: absolute; inset: 0; }
      .plate { position: absolute; display: block; }
      /* a screen recording cannot live inside a timed wrapper, so it carries
         its own timing and an untimed shell takes the fade */
      .shell { position: absolute; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.6"
      data-width="1080"
      data-height="1920"
    >

      <!-- p01  0.00-1.90s  "One of the sharpest marketing minds out there right now" -->

      <div class="shell" id="p01-shell" style="left:90px;top:1007px;width:900px;height:506px">
        <video class="clip" id="p01" src="../assets/photos/fill open.mov" data-start="0.0" data-duration="1.9" data-track-index="2" style="width:900px;height:506px;object-fit:cover;display:block" muted playsinline></video>
      </div>

      <!-- p02  1.95-2.90s  "is this guy." -->

      <div class="clip beat" id="p02" data-start="1.95" data-duration="0.95" data-track-index="1">
        <img class="plate" id="p02-img" src="../assets/photos/this guy.png" style="left:240px;top:986px;width:600px;height:549px" alt="" />
      </div>

      <!-- p03  2.95-7.40s  "insanely viral videos on Instagram" -->

      <div class="shell" id="p03-shell" style="left:90px;top:1007px;width:900px;height:506px">

      <div class="shell" id="p04-shell" style="left:90px;top:1007px;width:900px;height:506px">

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // p01 — fill open  "One of the sharpest marketing minds out there right now"
      tl.fromTo("#p01-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0.0);
      tl.to("#p01-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.6);
      // p02 — this guy  "is this guy."
      tl.fromTo("#p02-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 1.95);
      tl.to("#p02-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.6);
      // p03 — genjutsu viral  "insanely viral videos on Instagram"
      tl.fromTo("#p03-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 2.95);
      tl.to("#p03-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.1);
      // p04 — fill fashion  "His name is Alex Mashrabov"
      tl.fromTo("#p04-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 7.45);
      tl.to("#p04-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.65);
      // p05 — fill clips  "He's the CEO of Higgsfield"
      tl.fromTo("#p05-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 11.0);

      // p06 — users marketing  "he turned his users into his marketing team"
      tl.fromTo("#p06-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 14.45);
      tl.to("#p06-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 17.9);
      // p07 — api hub  "opened the door for other companies to compete with him"
      tl.fromTo("#p07-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 18.3);
      tl.to("#p07-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 21.35);
      // p08 — api live  "Higgsfield has just launched its API"
      tl.fromTo("#p08-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 21.7);

      // p09 — model list  "including Seedance, Kling, Soul, and Genjutsu"
      tl.fromTo("#p09-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 25.05);
      tl.to("#p09-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 27.55);
      // p10 — api key  "grab an API key and set up a clear distribution strategy"
      tl.fromTo("#p10-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 33.08);
      tl.to("#p10-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 36.48);
      // p11 — fill deploy  "Comment STRATEGY, and I'll send you the setup link"
      tl.fromTo("#p11-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 36.8);
      tl.to("#p11-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 40.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
