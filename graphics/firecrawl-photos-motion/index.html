<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>firecrawl-photos-motion (baked)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #000;
      }
      #src-video { width: 1920px; height: 1080px; object-fit: cover; }
      .beat { position: absolute; inset: 0; }
      .plate { position: absolute; display: block; }
      /* a screen recording cannot live inside a timed wrapper, so it carries
         its own timing and an untimed shell takes the fade */
      .shell { position: absolute; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.6"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="src-video"
        class="clip"
        src="assets/source.mp4"
        data-start="0"
        data-duration="29.6"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- p01  1.27-3.20s  "scrape any website for free" -->

      <div class="clip beat" id="p01" data-start="1.27" data-duration="1.93" data-track-index="2">
        <img class="plate" id="p01-img" src="assets/photos/website.png" style="left:1200px;top:244px;width:600px;height:393px" alt="" />
      </div>

      <!-- p02  3.38-5.85s  "with AI using Firecrawl" -->

      <div class="clip beat" id="p02" data-start="3.38" data-duration="2.47" data-track-index="1">
        <img class="plate" id="p02-img" src="assets/photos/firecrawl.png" style="left:1150px;top:356px;width:640px;height:149px" alt="" />
      </div>

      <!-- p03  6.04-7.32s  "building an AI agent" -->

      <div class="clip beat" id="p03" data-start="6.04" data-duration="1.28" data-track-index="2">
        <img class="plate" id="p03-img" src="assets/photos/ai agent.png" style="left:1180px;top:204px;width:640px;height:473px" alt="" />
      </div>

      <!-- p04  7.02-8.73s  "an SEO tool" -->

      <div class="clip beat" id="p04" data-start="7.02" data-duration="1.71" data-track-index="1">
        <img class="plate" id="p04-img" src="assets/photos/seo tool.png" style="left:1190px;top:244px;width:620px;height:413px" alt="" />
      </div>

      <!-- p05  8.43-9.70s  "or just a data extraction" -->

      <div class="clip beat" id="p05" data-start="8.43" data-duration="1.27" data-track-index="2">
        <img class="plate" id="p05-img" src="assets/photos/data extraction.png" style="left:1060px;top:275px;width:800px;height:330px" alt="" />
      </div>

      <!-- p06  12.34-15.70s  "very clean, structured dataset" -->

      <div class="clip beat" id="p06" data-start="12.34" data-duration="3.36" data-track-index="1">
        <img class="plate" id="p06-img" src="assets/photos/structured dataset.png" style="left:1010px;top:164px;width:860px;height:551px" alt="" />
      </div>

      <!-- p07  15.85-19.30s  "track product launches" -->

      <div class="shell" id="p07-shell" style="left:970px;top:246px;width:900px;height:368px">
        <video class="clip" id="p07" src="assets/photos/product launches.mov" data-start="15.85" data-duration="3.45" data-track-index="2" style="width:900px;height:368px;object-fit:cover;display:block" muted playsinline></video>
      </div>

      <!-- p08  19.48-23.80s  "all my homies love Firecrawl" -->

      <div class="clip beat" id="p08" data-start="19.48" data-duration="4.32" data-track-index="1">
        <img class="plate" id="p08-img" src="assets/photos/love firecrawl.png" style="left:1040px;top:211px;width:820px;height:458px" alt="" />
      </div>

      <!-- p09  23.98-29.45s  "they have a student program" -->

      <div class="clip beat" id="p09" data-start="23.98" data-duration="5.47" data-track-index="2">
        <img class="plate" id="p09-img" src="assets/photos/student program.png" style="left:1370px;top:163px;width:380px;height:574px" alt="" />
      </div>
      <audio
        id="src-audio"
        src="assets/source.mp4"
        data-start="0"
        data-duration="29.6"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // p01 — website  "scrape any website for free"
      tl.fromTo("#p01-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 1.27);
      tl.to("#p01-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.9);
      // p02 — firecrawl  "with AI using Firecrawl"
      tl.fromTo("#p02-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 3.38);
      tl.to("#p02-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.55);
      // p03 — ai agent  "building an AI agent"
      tl.fromTo("#p03-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 6.04);
      tl.to("#p03-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.02);
      // p04 — seo tool  "an SEO tool"
      tl.fromTo("#p04-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 7.02);
      tl.to("#p04-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 8.43);
      // p05 — data extraction  "or just a data extraction"
      tl.fromTo("#p05-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 8.43);
      tl.to("#p05-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.4);
      // p06 — structured dataset  "very clean, structured dataset"
      tl.fromTo("#p06-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 12.34);
      tl.to("#p06-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 15.4);
      // p07 — product launches  "track product launches"
      tl.fromTo("#p07-shell", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 15.85);
      tl.to("#p07-shell", { opacity: 0, duration: 0.3, ease: "power2.in" }, 19.0);
      // p08 — love firecrawl  "all my homies love Firecrawl"
      tl.fromTo("#p08-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 19.48);
      tl.to("#p08-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 23.5);
      // p09 — student program  "they have a student program"
      tl.fromTo("#p09-img", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 23.98);
      tl.to("#p09-img", { opacity: 0, duration: 0.3, ease: "power2.in" }, 29.15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
